[server]
address = "127.0.0.1"
headless = true
enableCORS = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = "none"

[theme]
base = "dark"
primaryColor = "#D3A1FF"
backgroundColor = "#090F20"
secondaryBackgroundColor = "#1B162D"
textColor = "#FAF5FF"
font = "sans serif"
